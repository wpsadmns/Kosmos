apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: kosmos-dev

resources:
  - ../../

patches:
  - target:
      kind: Deployment
      name: kosmos
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 500m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 1Gi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: 2
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 2Gi
  - target:
      kind: HorizontalPodAutoscaler
      name: kosmos-hpa
    patch: |
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 3
  - target:
      kind: StatefulSet
      name: postgres
    patch: |
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage
        value: 10Gi
  - target:
      kind: Ingress
      name: kosmos-ingress
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: kosmos-dev.local
      - op: remove
        path: /spec/tls

configMapGenerator:
  - name: kosmos-config-overlay
    behavior: merge
    literals:
      - LOG_LEVEL=DEBUG
      - DEBUG_MODE=true
